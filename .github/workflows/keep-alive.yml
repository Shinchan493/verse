# Pings the deployed API every 10 minutes so Render's free tier doesn't
# spin the instance down (idle timeout ~15 min; cold starts take 30-60s).
# One always-on service fits within Render's 750 free instance-hours/month.
#
# Note: GitHub may pause scheduled workflows after ~60 days without repo
# activity — a push re-enables them.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS --max-time 80 --retry 2 \
            "${API_HEALTH_URL:-https://collab-docs-api.onrender.com/health}" \
            && echo " — awake"
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
